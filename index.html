<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASF Sales Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink:     #0d1117;
  --paper:   #f4f2ed;
  --card:    #ffffff;
  --border:  #e0dbd2;
  --rule:    #c8c2b8;
  --text:    #1a1a1a;
  --muted:   #7a7167;
  --green:   #1a7a4a;
  --green-bg:#e8f5ee;
  --red:     #b83232;
  --red-bg:  #faeaea;
  --amber:   #a05a00;
  --amber-bg:#fff3e0;
  --accent:  #c8410a;
  --team1:   #1a4a7a;
  --team2:   #6b1a3a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;line-height:1.4;}
.page{max-width:1320px;margin:0 auto;padding:18px 20px 32px;}

/* HEADER */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:10px;border-bottom:3px solid var(--ink);margin-bottom:18px;}
.mh-left{display:flex;align-items:flex-end;gap:14px;}
.mh-title{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1;text-transform:uppercase;color:var(--ink);}
.mh-sub{display:block;font-size:11px;font-weight:600;letter-spacing:3px;color:var(--accent);font-family:'Barlow',sans-serif;text-transform:uppercase;margin-bottom:2px;}
.mh-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.live-tag{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);background:var(--green-bg);border:1px solid var(--green);padding:3px 7px;border-radius:2px;}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 1.6s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.ts{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);}

/* LAYOUT */
.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}

/* SECTIONS */
.section{background:var(--card);border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:9px 13px 8px;border-bottom:2px solid var(--ink);background:var(--ink);}
.sec-head h2{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff;}
.sec-tag{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;color:rgba(255,255,255,.45);letter-spacing:1px;text-transform:uppercase;}

/* TEAM HEADER */
.team-hdr{display:flex;align-items:center;padding:6px 13px;background:var(--tc,#111);border-bottom:1px solid rgba(0,0,0,.1);}
.team-lbl{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;}
.team-wtd{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.75);}

/* LEADERBOARD TABLE */
.lb-tbl{width:100%;border-collapse:collapse;}
.lb-tbl thead tr{background:#f7f5f2;border-bottom:1px solid var(--rule);}
.lb-tbl th{padding:4px 13px;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:right;white-space:nowrap;}
.lb-tbl th:first-child{text-align:left;}
.lb-tbl tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
.lb-tbl tbody tr:last-child{border-bottom:none;}
.lb-tbl tbody tr:hover{background:#faf9f6;}
.lb-tbl td{padding:6px 13px;text-align:right;vertical-align:middle;}
.lb-tbl td:first-child{text-align:left;}
.rep-name{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.2px;}
.rep-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;}
.pct-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.pct-val{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;}
.bar-track{width:52px;height:3px;background:var(--border);border-radius:1px;overflow:hidden;}
.bar-fill{height:100%;border-radius:1px;transition:width .9s cubic-bezier(.4,0,.2,1);}

/* INITIATIVES */
.init{border-bottom:1px solid var(--border);}
.init:last-child{border-bottom:none;}
.init-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 13px 7px;background:#f9f8f5;border-bottom:1px solid var(--border);}
.init-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.init-total{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--accent);}
.init-sub{padding:3px 13px 2px;font-size:9px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);background:#f4f2ed;border-bottom:1px solid var(--border);}
.init-reps-tbl{width:100%;border-collapse:collapse;}
.init-reps-tbl th{padding:3px 13px;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:right;background:#f7f5f2;}
.init-reps-tbl th:first-child{text-align:left;}
.init-reps-tbl td{padding:5px 13px;border-top:1px solid var(--border);text-align:right;font-size:12px;}
.init-reps-tbl td:first-child{text-align:left;}
.init-reps-tbl tr:hover td{background:#faf9f6;}
.medal{font-size:13px;margin-right:4px;}

/* DEALERS GRID */
.dealers-wrap{border-top:1px solid var(--border);}
.dealers-team-label{padding:5px 13px 3px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--border);background:#f4f2ed;}
.dealers-row{display:flex;flex-wrap:wrap;gap:1px;background:var(--border);}
.dealer-cell{background:var(--card);padding:7px 11px;flex:1;min-width:80px;}
.d-name{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
.d-count{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;color:var(--accent);line-height:1.1;}
.d-lbl{font-size:9px;color:var(--muted);}

/* LOADING */
.loading-state{padding:36px;text-align:center;color:var(--muted);font-size:12px;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:7px;}
@keyframes spin{to{transform:rotate(360deg)}}

.fade-in{animation:fu .32s ease both;}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.s1{animation-delay:.04s}.s2{animation-delay:.08s}.s3{animation-delay:.12s}.s4{animation-delay:.16s}

@media(max-width:940px){.layout{grid-template-columns:1fr;}}
</style>
</head>

// Seasonal budget weights (Q1=0.22, Q2=0.2363, Q3=0.2849, Q4=0.2588)
const MONTH_WEIGHTS = {
  '01':0.22/3,'02':0.22/3,'03':0.22/3,

// Current Acumatica financial period (fiscal month = calendar +2 for this company)
// Confirmed: InvoiceDate 2026-04-23 → FinancialPeriod 202606
const NOW = new Date();
function curFinPeriod() {
  const calM = NOW.getMonth()+1; // 1-12
  const fiscM = calM + 2;
  const y = fiscM > 12 ? NOW.getFullYear()+1 : NOW.getFullYear();
  const m = fiscM > 12 ? fiscM-12 : fiscM;
  return `${y}${String(m).padStart(2,'0')}`;
}
const CUR_PERIOD = curFinPeriod(); // e.g. '202606'
const CUR_MO_KEY = CUR_PERIOD.slice(4); // '06'
const CUR_YEAR = CUR_PERIOD.slice(0,4); // '2026'
// YTD periods: fiscal year starts at period 01 (Nov of prior calendar year)
// Build dynamically from 202601 up to current period
const YTD_PERIODS = (() => {
  const periods = [];
  const curNum = parseInt(CUR_PERIOD); // e.g. 202606
  const yearStart = parseInt(CUR_PERIOD.slice(0,4) + '01'); // e.g. 202601
  for(let p = yearStart; p <= curNum; p++) {
    const mo = p % 100;
    if(mo >= 1 && mo <= 12) periods.push(String(p));
  }
  return periods;
})();

function monthBudget(rep) { return rep.annualBudget * (MONTH_WEIGHTS[CUR_MO_KEY] || 1/12); }
function monthBhag(rep)   { return rep.annualBhag   * (MONTH_WEIGHTS[CUR_MO_KEY] || 1/12); }
function weekBudget(rep)  { return monthBudget(rep) / 4.33; }

// YTD budget = sum of each completed+current period's weight × annual target
function ytdBudget(rep) {
  return YTD_PERIODS.reduce((s,p) => s + rep.annualBudget * (MONTH_WEIGHTS[p.slice(4)] || 1/12), 0);
}
function ytdBhag(rep) {
  return YTD_PERIODS.reduce((s,p) => s + rep.annualBhag * (MONTH_WEIGHTS[p.slice(4)] || 1/12), 0);
}

// Week start (Monday)
function weekStart() {
  const d=new Date(NOW); const day=d.getDay(); const diff=day===0?-6:1-day;
  d.setDate(d.getDate()+diff); d.setHours(0,0,0,0);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

// Period label: '202606' → 'Apr 2026'  (fiscal month - 2 = calendar)
function periodLabel(fp) {
  const MONTHS=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const y=fp.slice(0,4), fm=parseInt(fp.slice(4));
  const cm = fm-2 <= 0 ? fm-2+12 : fm-2;
  return `${MONTHS[cm]} ${y}`;
}

// ════════════════════════════════════════════

const DATA = {

    'TOM G':{ '202601':19025.26,  '202602':36028.37,  '202603':56687.32,  '202604':45666.91,  '202605':51681.11,  '202606':32352.18 },

// ════════════════════════════════════════════
// LIVE DATA FETCH
// Reads pre-cached data from Cloudflare KV
// via the scoreboard Worker. Worker refreshes
// from Acumatica at 6am and 3pm daily.
// ════════════════════════════════════════════
const WORKER_URL = 'https://asf-scoreboard-proxy.greg-capell.workers.dev';

async function loadLiveData() {
  try {
    const res = await fetch(`${WORKER_URL}/data`);
    if (!res.ok) { console.warn('Worker error', res.status); return; }
    const d = await res.json();
    if (d.error) { console.warn('Data error:', d.error); return; }

    // Compute Monday of current week
    const now = new Date();
    const day = now.getDay();
    const mon = new Date(now);
    mon.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
    mon.setHours(0,0,0,0);
    const sixMoAgo = new Date(now);
    sixMoAgo.setMonth(sixMoAgo.getMonth() - 6);

    // ── Monthly sales by rep ──────────────────────────────────────────
    if (d.repMonthly?.length) {
      const m = {};
      d.repMonthly.forEach(r => {
        const sub = (r.Subaccount||'').trim();
        const rep = REPS.find(x => x.sub === sub);
        if (!rep) return;
        if (!m[rep.code]) m[rep.code] = {};
        m[rep.code][r.FinancialPeriod] = parseFloat(r.Sales) || 0;
      });
      Object.assign(DATA.repMonthly, m);
    }

    // ── Weekly sales by rep ───────────────────────────────────────────
    if (d.weekSales?.length) {
      d.weekSales.forEach(r => {
        const sub = (r.Subaccount||'').trim();
        const rep = REPS.find(x => x.sub === sub);
        if (rep) DATA.weekSales[rep.code] = parseFloat(r.Sales) || 0;
      });
    }

    // ── INVIUS (NOX LVT + EVT) ────────────────────────────────────────
    if (d.noxItems?.length) {
      const agg = {};
      d.noxItems.forEach(r => {
        const ic = (r.ItemClass||'');
        if (!ic.includes('LVT') && !ic.includes('EVT')) return;
        const n = (r.SalesRep||'').trim();
        agg[n] = (agg[n]||0) + (parseFloat(r.Sales)||0);
      });
      if (Object.keys(agg).length > 0) {
        DATA.invius = Object.entries(agg)
          .map(([n,s]) => ({ rep:n, code:FULLNAME_MAP[n]||null, ytd:s }))
          .filter(x => x.ytd > 0).sort((a,b) => b.ytd - a.ytd);
      }
    }

    // ── Maxxon SkimFill ───────────────────────────────────────────────
    if (d.maxxonItems?.length) {
      const agg = {};
      d.maxxonItems.forEach(r => {
        const n = (r.SalesRep||'').trim();
        if (n === 'Default') return;
        agg[n] = (agg[n]||0) + (parseFloat(r.Sales)||0);
      });
      if (Object.keys(agg).length > 0) {
        DATA.maxxon = Object.entries(agg)
          .map(([n,s]) => ({ rep:n, code:FULLNAME_MAP[n]||null, ytd:s }))
          .filter(x => x.ytd > 0).sort((a,b) => b.ytd - a.ytd);
      }
    }

    // ── McKinley LVT ──────────────────────────────────────────────────
    if (d.mckinleyItems?.length) {
      const agg = {};
      d.mckinleyItems.forEach(r => {
        const n = (r.SalesRep||'').trim();
        agg[n] = (agg[n]||0) + (parseFloat(r.Sales)||0);
      });
      if (Object.keys(agg).length > 0) {
        DATA.mckinley = Object.entries(agg)
          .map(([n,s]) => ({ rep:n, code:FULLNAME_MAP[n]||null, ytd:s }))
          .filter(x => x.ytd > 0).sort((a,b) => b.ytd - a.ytd);
      }
    }

    // ── Supporting Dealers ────────────────────────────────────────────
    if (d.dealerCustomers?.length) {
      const bestRow = {};
      d.dealerCustomers.forEach(r => {
        if ((r.BusinessAccountClass||'').trim() !== 'DEALER') return;
        const cid = (r.CustomerID||'').trim();
        if (!cid || !r.DisplaysPlaced || !r.DisplaysPlaced.trim()) return;
        const sp = (r.DefaultSalesperson||'').trim();
        const spValid = !!REPS.find(x => x.code === sp);
        const total = parseFloat(r.Total6Mo) || 0;
        const ex = bestRow[cid];
        const exSpValid = ex && !!REPS.find(x => x.code === (ex.DefaultSalesperson||'').trim());
        if (!ex || (!exSpValid && spValid) || (spValid && total > (parseFloat(ex.Total6Mo)||0))) {
          bestRow[cid] = r;
        }
      });
      const dealers = {};
      Object.entries(bestRow).forEach(([cid, r]) => {
        if ((parseFloat(r.Total6Mo)||0) / 6 < 2000) return;
        const repCode = (r.DefaultSalesperson||'').trim();
        const rep = REPS.find(x => x.code === repCode);
        if (!rep) return;
        if (!dealers[repCode]) dealers[repCode] = { name:rep.name, count:0, customers:[] };
        dealers[repCode].count++;
        dealers[repCode].customers.push({
          id: cid,
          name: (r.CustomerName||'').trim(),
          displays: (r.DisplaysPlaced||'').trim(),
          avgMo6: (parseFloat(r.Total6Mo)||0) / 6
        });
      });
      DATA.dealers = dealers;
    }

  } catch(e) {
    console.warn('loadLiveData error', e);
  }
}

// ════════════════════════════════════════════
// FORMAT HELPERS
// ════════════════════════════════════════════
const fmtK=n=>{if(n==null)return'—';if(Math.abs(n)>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(Math.abs(n)>=1e3)return'$'+(n/1e3).toFixed(0)+'K';return'$'+Math.round(n);};
const pctFmt=n=>(n*100).toFixed(0)+'%';
const pctColor=p=>p>=1?'#1a7a4a':p>=0.75?'#a05a00':'#b83232';
const barBg=p=>p>=1?'var(--green)':p>=0.75?'#e08000':'var(--red)';
const MEDALS=['🥇','🥈','🥉'];

// ════════════════════════════════════════════
// RENDER LEADERBOARD  (sorted by WTD % of weekly budget desc, team badge on each row)
// ════════════════════════════════════════════
function renderLeaderboard() {
  // Sort all reps by WTD sales as % of weekly budget descending
  const sorted = [...REPS].sort((a,b)=>{
    const wPctA = weekBudget(a)>0 ? (DATA.weekSales[a.code]||0)/weekBudget(a) : 0;
    const wPctB = weekBudget(b)>0 ? (DATA.weekSales[b.code]||0)/weekBudget(b) : 0;
    return wPctB - wPctA;
  });
  const rows = sorted.map((rep,i)=>{
    const w    = DATA.weekSales[rep.code]||0;
    const mtd  = (DATA.repMonthly[rep.code]||{})[CUR_PERIOD]||0;
    const ytd  = YTD_PERIODS.reduce((s,p)=>s+((DATA.repMonthly[rep.code]||{})[p]||0),0);
    const wbgt = weekBudget(rep);
    const mbgt = monthBudget(rep);
    const mbhg = monthBhag(rep);
    const ybgt = ytdBudget(rep);
    const ybhg = ytdBhag(rep);
    const wPct  = wbgt>0?w/wbgt:0;
    const mbPct = mbgt>0?mtd/mbgt:0;
    const mhPct = mbhg>0?mtd/mbhg:0;
    const ybPct = ybgt>0?ytd/ybgt:0;
    const yhPct = ybhg>0?ytd/ybhg:0;
    const tc    = TEAM_COLORS[rep.team];

    const stackedCell = (pct1, label1, pct2, label2) => `
      <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
        <div class="pct-wrap" style="align-items:flex-end">
          <div style="display:flex;align-items:center;gap:4px;justify-content:flex-end">
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)">${label1}</span>
            <span class="pct-val" style="color:${pctColor(pct1)}">${pctFmt(pct1)}</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.min(pct1*100,100)}%;background:${barBg(pct1)}"></div></div>
        </div>
        <div class="pct-wrap" style="align-items:flex-end">
          <div style="display:flex;align-items:center;gap:4px;justify-content:flex-end">
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)">${label2}</span>
            <span class="pct-val" style="color:${pctColor(pct2)}">${pctFmt(pct2)}</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.min(pct2*100,100)}%;background:${barBg(pct2)}"></div></div>
        </div>
      </div>`;

    return `
    <tr class="fade-in">
      <td style="padding-left:10px;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;color:var(--rule);min-width:18px;">${i+1}</span>
          <div>
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="rep-name">${rep.name}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:1px 5px;border-radius:2px;border:1px solid ${tc};color:${tc};white-space:nowrap;">${rep.team.split(' ')[0]}</span>
            </div>
            <div class="rep-sub">${fmtK(wbgt)}/wk · ${fmtK(mbgt)}/mo budget · MTD ${fmtK(mtd)}</div>
          </div>
        </div>
      </td>
      <td>
        <div class="pct-wrap" style="align-items:flex-end">
          <span class="mono" style="font-size:12px">${fmtK(w)}</span>
          <div style="display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:2px">
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)">Bgt</span>
            <span class="pct-val" style="color:${pctColor(wPct)}">${pctFmt(wPct)}</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.min(wPct*100,100)}%;background:${barBg(wPct)}"></div></div>
        </div>
      </td>
      <td>${stackedCell(mbPct,'Bgt',mhPct,'BHAG')}</td>
      <td>${stackedCell(ybPct,'Bgt',yhPct,'BHAG')}</td>
    </tr>`;
  }).join('');

  return `
  <table class="lb-tbl">
    <thead><tr>
      <th style="width:34%">Rep</th>
      <th style="width:22%">WTD Sales &amp; % of Wk Budget</th>
      <th style="width:22%">Cumul. % of MTD Budget &amp; BHAG</th>
      <th style="width:22%">Cumul. % of YTD Budget &amp; BHAG</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ════════════════════════════════════════════
// RENDER INITIATIVES
// ════════════════════════════════════════════
function topRepsTable(rows,limit=3){
  // Only show reps that are active (exist in REPS array)
  const activeRows = rows.filter(r=>r.ytd>0 && REPS.find(x=>x.code===r.code));
  const top=activeRows.sort((a,b)=>b.ytd-a.ytd).slice(0,limit);
  const tot=activeRows.reduce((s,r)=>s+r.ytd,0);
  if(!top.length) return '<div style="padding:8px 13px;font-size:11px;color:var(--muted)">No data yet</div>';
  return `<table class="init-reps-tbl">
    <thead><tr><th>Rep</th><th>YTD Sales</th><th>Share</th></tr></thead>
    <tbody>${top.map((r,i)=>`<tr>
      <td><span class="medal">${MEDALS[i]||''}</span>${r.rep}</td>
      <td class="mono">${fmtK(r.ytd)}</td>
      <td class="mono">${tot>0?((r.ytd/tot)*100).toFixed(0)+'%':'—'}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function renderInitiatives(){
  const inviusTot = DATA.invius.reduce((s,r)=>s+r.ytd,0);
  const maxxonTot = DATA.maxxon.filter(r=>r.rep!=='Default').reduce((s,r)=>s+r.ytd,0);
  const mckinleyTot = DATA.mckinley.reduce((s,r)=>s+r.ytd,0);

  return `
    <!-- INVIUS -->
    <div class="init fade-in s1">
      <div class="init-hdr">
        <span class="init-title">INVIUS Sales</span>
        <span class="init-total">${fmtK(inviusTot)} YTD</span>
      </div>
      <div class="init-sub">Item Classes: NOX LVT + NOX EVT &nbsp;·&nbsp; Top 3 Reps</div>
      ${topRepsTable(DATA.invius)}
    </div>

    <!-- MAXXON SKIMFILL -->
    <div class="init fade-in s2">
      <div class="init-hdr">
        <span class="init-title">Maxxon SkimFill</span>
        <span class="init-total">${fmtK(maxxonTot)} YTD</span>
      </div>
      <div class="init-sub">Inventory ID 12622 &nbsp;·&nbsp; Top 3 Reps</div>
      ${topRepsTable(DATA.maxxon.filter(r=>r.rep!=='Default'))}
    </div>

    <!-- MCKINLEY -->
    <div class="init fade-in s3">
      <div class="init-hdr">
        <span class="init-title">McKinley Sales</span>
        <span class="init-total">${fmtK(mckinleyTot)} YTD</span>
      </div>
      <div class="init-sub">Descriptions containing "McKinley LVT" &nbsp;·&nbsp; Top 3 Reps</div>
      ${topRepsTable(DATA.mckinley)}
    </div>

    <!-- SUPPORTING DEALERS -->
    <div class="init fade-in s4">
      <div class="init-hdr">
        <span class="init-title">Supporting Dealers</span>
        <span class="init-total" style="font-size:11px;color:var(--muted)">Displays placed · Avg ≥$2K/mo (last 6 mo)</span>
      </div>
      <div class="init-sub">GC-TargetCustomers · DEALER class · DisplaysPlaced set · avg monthly sales ≥ $2,000 over last 6 months</div>
      <div class="dealers-wrap">
        ${(()=>{
          // Build rows sorted by count desc, grouped by team
          const teamDefs = [
            {team:'Bob Brown',   color:TEAM_COLORS['Bob Brown'],  codes:['AD','AJ','BB','BT','DA','MJ','TOM G']},
            {team:'Phil Branon', color:TEAM_COLORS['Phil Branon'], codes:['JB','DL','MM','NP','SM']},
          ];
          return teamDefs.map(t=>{
            // Sort reps within team by dealer count descending
            const sortedCodes = [...t.codes].sort((a,b)=>{
              const ca = DATA.dealers[a]?.count ?? -1;
              const cb = DATA.dealers[b]?.count ?? -1;
              return cb - ca;
            });
            return `
            <div class="dealers-team-label" style="color:${t.color}">&nbsp;Team ${t.team}</div>
            <div class="dealers-row">
              ${sortedCodes.map(code=>{
                const rep  = REPS.find(r=>r.code===code);
                if(!rep) return '';
                const d    = DATA.dealers[code];
                const cnt  = d ? d.count : '—';
                const fname= rep.name.split(' ')[0];
                const hasData = d && d.count >= 0;
                return `<div class="dealer-cell">
                  <div class="d-name">${fname}</div>
                  <div class="d-count" style="${!hasData?'color:var(--muted);font-size:16px':''}">${cnt}</div>
                  <div class="d-lbl">dealers</div>
                </div>`;
              }).join('')}
            </div>`;
          }).join('');
        })()}
      </div>
    </div>`;
}

// ════════════════════════════════════════════
// MAIN RENDER
// ════════════════════════════════════════════
function render(){
  document.getElementById('body').innerHTML=`
  <div class="layout">
    <div>
      <div class="section fade-in">
        <div class="sec-head">
          <h2>Weekly Leaderboard</h2>
          <span class="sec-tag">Ranked by % of Wk Budget · MTD ${periodLabel(CUR_PERIOD)} · wk of ${weekStart()}</span>
        </div>
        ${renderLeaderboard()}
      </div>
    </div>
    <div>
      <div class="section fade-in s1">
        <div class="sec-head">
          <h2>Sales Initiatives</h2>
          <span class="sec-tag">YTD 2026 · Live Acumatica</span>
        </div>
        ${renderInitiatives()}
      </div>
    </div>
  </div>`;
  document.getElementById('ts').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
async function init(){
  render(); // show snapshot immediately
  await loadLiveData().catch(()=>{});
  render(); // re-render with live data
}

init();
</script>
